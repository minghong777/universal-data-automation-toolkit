name: Python tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install verified dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run automated tests
        run: python -m pytest -q
      - name: Review release candidates
        run: python scripts/release_check.py
